<!-- Trecho focado no Menu e no Assistente. Mantenha os estilos anteriores e substitua as telas abaixo -->

<!-- TELA MENU ATUALIZADA -->
<div id="screen-menu" class="screen active">
    <div class="profile-section">
        <div class="avatar">A</div>
        <h2>Olá, Alcino!</h2>
        <div class="streak-badge" id="streakBadge">🔥 0 Treinos</div>
    </div>
    <div class="menu-grid" id="menuList">
        <div class="menu-card" onclick="openScreen('screen-iniciante')">
            <div class="menu-icon">💪</div>
            <div><h2>Iniciante 1</h2><p>Circuito Full Body.</p></div>
        </div>
        <div class="menu-card" onclick="openScreen('screen-corrida')">
            <div class="menu-icon">🏃‍♂️</div>
            <div><h2>Corrida Livre</h2><p>GPS e Mapa.</p></div>
        </div>
        <!-- Botão Criar Treino -->
        <div class="menu-card" onclick="openScreen('screen-assistant')" style="border: 2px dashed var(--primary);">
            <div class="menu-icon">🤖</div>
            <div><h2>Assistente IA</h2><p>Criar novo treino personalizado.</p></div>
        </div>
    </div>
</div>

<!-- TELA ASSISTENTE -->
<div id="screen-assistant" class="screen">
    <header><button class="btn-back" onclick="openScreen('screen-menu')">❮</button><h1>Configurar Treino</h1></header>
    <div style="padding: 20px;">
        <textarea id="aiForm" style="width:100%; height:300px; background:var(--bg-card); color:white; border-radius:10px; padding:10px; border:none;" 
        placeholder="Copie e preencha:
Nome:
Idade:
Peso/Altura:
Local (Casa/Academia/Ar livre):
Equipamentos:
Objetivo:
Tempo disponível:
Restrições:"></textarea>
        <button class="btn-play" style="margin-top:20px;" onclick="copyFormData()">📋 COPIAR DADOS P/ IA</button>
    </div>
</div>

<script>
    function copyFormData() {
        const text = document.getElementById('aiForm').value;
        navigator.clipboard.writeText(text);
        alert("Dados copiados! Agora cole aqui na nossa conversa para eu montar seu treino.");
    }
</script>
